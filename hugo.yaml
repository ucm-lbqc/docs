# Hugo configuration file
title: LBQC

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [html]
  page: [html, markdown]
  section: [html, rss, markdown]

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Affiliation
      pageRef: /affiliation
      weight: 3
    - name: Team
      pageRef: /team
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/ucm-lbqc/docs/edit/main/content"

  page:
    contextMenu:
      enable: true
